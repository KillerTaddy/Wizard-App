<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My Wizard Score Tracker Main Test </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>My Wizard Score Tracker</h1>

<div class="controls">
    <div class="controls-left">
        <div>
            <label for="playerCount" style="font-weight: bold; margin-right: 10px;">Number of Players:</label>
            <select id="playerCount" onchange="initializeGame()">
                <option value="3">3 Players</option>
                <option value="4" selected>4 Players</option>
                <option value="5">5 Players</option>
                <option value="6">6 Players</option>
            </select>
        </div>
        <div class="toggle-container">
            <input type="checkbox" id="canadianRule" onchange="calculateScores()">
            <label for="canadianRule" title="Dealer cannot make bids 'even' if they are in the lead.">"Even Bids" Warning</label>
        </div>
        <div class="toggle-container">
            <input type="checkbox" id="wakeLockToggle" onchange="toggleWakeLock()">
            <label for="wakeLockToggle" title="Prevent your screen from going to sleep during the game.">Keep Screen On</label>
        </div>
    </div>
    <div class="controls-right">
        <button onclick="resetBoard()">Reset Game</button>
    </div>
</div>

<div class="game-desc" id="gameDesc">
    </div>

<div class="container">
    <table id="scoreTable">
        <thead id="tableHead">
            </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script src="app.js" defer></script>

</body>
</html>
