<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard Score Tracker (4 Players)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            vertical-align: top;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .player-name {
            width: 90%;
            padding: 5px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .round-info {
            font-weight: bold;
            font-size: 16px;
        }
        .tricks-avail {
            font-size: 12px;
            color: #7f8c8d;
        }
        .input-group {
            display: flex;
            justify-content: space-around;
            margin-bottom: 5px;
        }
        .input-group label {
            font-size: 12px;
            display: block;
            margin-bottom: 2px;
        }
        input[type="number"] {
            width: 40px;
            padding: 4px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .scores {
            background-color: #ecf0f1;
            padding: 5px;
            border-radius: 4px;
            margin-top: 5px;
            font-size: 14px;
        }
        .total-score {
            font-weight: bold;
            font-size: 18px;
            color: #27ae60;
            display: block;
            margin-top: 4px;
        }
        .negative {
            color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Wizard Score Tracker</h1>
    <p style="text-align: center;">4 Players = 15 Rounds. Points: Correct Bid = 20 + (10 &times; Tricks). Incorrect = -10 &times; Difference.</p>
    
    <table id="scoreTable">
        <thead>
            <tr>
                <th>Round</th>
                <th><input type="text" class="player-name" value="Player 1"></th>
                <th><input type="text" class="player-name" value="Player 2"></th>
                <th><input type="text" class="player-name" value="Player 3"></th>
                <th><input type="text" class="player-name" value="Player 4"></th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    const totalRounds = 15;
    const numPlayers = 4;
    const tbody = document.getElementById('tableBody');

    // Generate Table Rows
    for (let r = 1; r <= totalRounds; r++) {
        const tr = document.createElement('tr');
        
        // Round Column
        const tdRound = document.createElement('td');
        tdRound.innerHTML = `<div class="round-info">Round ${r}</div><div class="tricks-avail">(${r} tricks)</div>`;
        tr.appendChild(tdRound);

        // Player Columns
        for (let p = 1; p <= numPlayers; p++) {
            const tdPlayer = document.createElement('td');
            tdPlayer.innerHTML = `
                <div class="input-group">
                    <div>
                        <label>Bid</label>
                        <input type="number" min="0" max="${r}" class="bid p${p}-r${r}" onchange="calculateScores()">
                    </div>
                    <div>
                        <label>Won</label>
                        <input type="number" min="0" max="${r}" class="won p${p}-r${r}" onchange="calculateScores()">
                    </div>
                </div>
                <div class="scores">
                    Round Pts: <span class="round-pts p${p}-r${r}">-</span>
                    <span class="total-score p${p}-r${r}">-</span>
                </div>
            `;
            tr.appendChild(tdPlayer);
        }
        tbody.appendChild(tr);
    }

    function calculateScores() {
        for (let p = 1; p <= numPlayers; p++) {
            let runningTotal = 0;
            
            for (let r = 1; r <= totalRounds; r++) {
                const bidInput = document.querySelector(`.bid.p${p}-r${r}`).value;
                const wonInput = document.querySelector(`.won.p${p}-r${r}`).value;
                const roundPtsDisplay = document.querySelector(`.round-pts.p${p}-r${r}`);
                const totalScoreDisplay = document.querySelector(`.total-score.p${p}-r${r}`);

                if (bidInput !== "" && wonInput !== "") {
                    const bid = parseInt(bidInput);
                    const won = parseInt(wonInput);
                    let roundScore = 0;

                    if (bid === won) {
                        roundScore = 20 + (won * 10);
                    } else {
                        roundScore = -10 * Math.abs(bid - won);
                    }

                    runningTotal += roundScore;

                    // Update UI
                    roundPtsDisplay.textContent = roundScore > 0 ? "+" + roundScore : roundScore;
                    totalScoreDisplay.textContent = runningTotal;
                    
                    if (runningTotal < 0) {
                        totalScoreDisplay.classList.add('negative');
                    } else {
                        totalScoreDisplay.classList.remove('negative');
                    }
                } else {
                    // Clear downstream if missing data
                    roundPtsDisplay.textContent = "-";
                    totalScoreDisplay.textContent = "-";
                }
            }
        }
    }
</script>

</body>
</html>
